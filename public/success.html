<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Payment Under Review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;font-family:Inter, sans-serif;background:#F8F2EA;color:#2C1E13;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
    .card{max-width:520px;background:#fff;border-radius:22px;box-shadow:0 30px 60px rgba(44,30,19,0.12);padding:32px}
    h1{margin:0 0 16px;font-size:32px;line-height:1.1;color:#5B4A3F}
    p{margin:14px 0;color:#5B4A3F;line-height:1.7;font-size:16px}
    .note{margin-top:22px;font-size:14px;color:#8A6A52}
    .order-id{margin-top:20px;padding:14px;border-radius:12px;background:#F1E4D4;color:#3B2A22;font-weight:700;word-break:break-all}
  </style>
</head>
<body>
  <div class="card">
    <h1>Thank you. Payment proof received.</h1>
    <p>Your order is now under verification. Once the admin approves it, you will receive the ebook download link on WhatsApp.</p>
    <p class="note">Please do not refresh this page. Your payment proof has already been submitted.</p>
    <div id="orderInfo" class="order-id">Order ID: <span id="orderIdText">—</span></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const orderId = params.get('orderId');
    if (orderId) {
      document.getElementById('orderIdText').textContent = orderId;
    }
  </script>
</body>
</html>
